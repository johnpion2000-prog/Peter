<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nana Market · Products</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', sans-serif; }
        body { background:#f5f9fe; padding:2rem; }
        .container { max-width:1400px; margin:0 auto; }
        .navbar { display:flex; flex-wrap:wrap; justify-content:space-between; background:white; padding:1rem 2rem; border-radius:60px; margin-bottom:2rem; }
        .logo { font-size:2rem; font-weight:800; background:linear-gradient(145deg,#1d4e6b,#c05e1a); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .nav-links a { text-decoration:none; background:#eef3f9; color:#1d4059; padding:0.5rem 1rem; border-radius:40px; margin:0 0.2rem; }
        .page-title { font-size:2rem; color:#1d4e6b; border-left:7px solid #e67e2a; padding-left:1rem; margin:1.5rem 0; }
        .category-filter { display:flex; gap:0.8rem; flex-wrap:wrap; margin:1rem 0; }
        .cat-pill { background:white; border:1px solid #aac1d6; padding:0.5rem 1.6rem; border-radius:40px; cursor:pointer; transition:0.1s; }
        .cat-pill:hover { background:#e3effa; }
        .active-cat { background:#1d4e6b; color:white; border-color:#1d4e6b; }
        .product-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:2rem; }
        .product-card { background:white; border-radius:2rem; padding:1.2rem; text-align:center; cursor:pointer; border:2px solid transparent; transition:0.1s; }
        .product-card.selected { border-color:#e67e2a; background:#fffbf2; }
        .product-card img { width:130px; height:130px; object-fit:cover; border-radius:1rem; background:#f0f7fd; }
        .product-price { font-size:1.4rem; font-weight:800; color:#c05e1a; }
        .product-shop { font-size:0.9rem; color:#3e6b8c; margin-top:0.2rem; }
    </style>
</head>
<body>
<div class="container">
    <div class="navbar">
        <div class="logo"><i class="fas fa-store"></i> Nana</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="cart.html">Cart</a>
        </div>
    </div>
    <h1 class="page-title">All products (including pharmacy)</h1>
    <div class="category-filter" id="categoryFilter"></div>
    <div class="product-grid" id="productGrid"></div>
</div>

<script>
(function() {
    // ---------- helper to seed pharmacy and other products if none exist ----------
    function seedProductsIfEmpty() {
        let existing = JSON.parse(localStorage.getItem('nanaAllProducts'));
        if (existing && existing.length > 0) return existing;

        // Create a rich set of products with pharmacy and other categories
        const shops = [
            { name: 'Kigali Electronics', vendor: 'vendor1@nana.rw', cats: ['Electronics'] },
            { name: 'Fashion House', vendor: 'vendor2@nana.rw', cats: ['Fashion'] },
            { name: 'Pet Kingdom', vendor: 'vendor3@nana.rw', cats: ['Pets'] },
            { name: 'Book Haven', vendor: 'vendor4@nana.rw', cats: ['Books'] },
            { name: 'Home & Living', vendor: 'vendor5@nana.rw', cats: ['Home'] },
            { name: 'Pharmacy Plus', vendor: 'pharmacy@nana.rw', cats: ['Pharmacy'] },
            { name: 'Wellness Center', vendor: 'wellness@nana.rw', cats: ['Pharmacy', 'Health'] }
        ];

        const products = [];
        let id = Date.now();

        // 1. Electronics (10 items)
        for (let i=1; i<=10; i++) {
            products.push({
                id: id++,
                vendorEmail: shops[0].vendor,
                shopName: shops[0].name,
                name: `Smartphone ${i}`,
                price: 120000 + i*5000,
                category: 'Electronics',
                imageUrl: 'https://via.placeholder.com/200?text=Phone+'+i
            });
        }
        // 2. Fashion (10)
        for (let i=1; i<=10; i++) {
            products.push({
                id: id++,
                vendorEmail: shops[1].vendor,
                shopName: shops[1].name,
                name: `T-shirt ${i}`,
                price: 5000 + i*700,
                category: 'Fashion',
                imageUrl: 'https://via.placeholder.com/200?text=Shirt+'+i
            });
        }
        // 3. Pets (8)
        for (let i=1; i<=8; i++) {
            products.push({
                id: id++,
                vendorEmail: shops[2].vendor,
                shopName: shops[2].name,
                name: `Dog food ${i}`,
                price: 8500 + i*600,
                category: 'Pets',
                imageUrl: 'https://via.placeholder.com/200?text=Pet+'+i
            });
        }
        // 4. Books (7)
        for (let i=1; i<=7; i++) {
            products.push({
                id: id++,
                vendorEmail: shops[3].vendor,
                shopName: shops[3].name,
                name: `Novel ${i}`,
                price: 3500 + i*400,
                category: 'Books',
                imageUrl: 'https://via.placeholder.com/200?text=Book+'+i
            });
        }
        // 5. Home (8)
        for (let i=1; i<=8; i++) {
            products.push({
                id: id++,
                vendorEmail: shops[4].vendor,
                shopName: shops[4].name,
                name: `Cushion ${i}`,
                price: 6200 + i*300,
                category: 'Home',
                imageUrl: 'https://via.placeholder.com/200?text=Home+'+i
            });
        }
        // 6. PHARMACY products (15 items) – medicines, supplements, care
        const pharmaItems = [
            'Paracetamol 500mg', 'Amoxicillin 250mg', 'Vitamin C 1000mg', 'Ibuprofen 400mg',
            'Cough syrup', 'Antihistamine', 'First aid kit', 'Digital thermometer',
            'Blood pressure monitor', 'Omega-3 capsules', 'Multivitamin tablets',
            'Hand sanitizer 500ml', 'Face masks (50 pcs)', 'Glucose powder', 'Calcium supplement'
        ];
        pharmaItems.forEach((item, idx) => {
            products.push({
                id: id++,
                vendorEmail: shops[5].vendor,
                shopName: shops[5].name,
                name: item,
                price: 1500 + idx * 1100,
                category: 'Pharmacy',
                imageUrl: `https://via.placeholder.com/200?text=Pharma+${idx+1}`
            });
        });
        // 7. Additional Health & Wellness (5)
        for (let i=1; i<=5; i++) {
            products.push({
                id: id++,
                vendorEmail: shops[6].vendor,
                shopName: shops[6].name,
                name: `Wellness product ${i}`,
                price: 4200 + i*900,
                category: 'Health',
                imageUrl: 'https://via.placeholder.com/200?text=Wellness+'+i
            });
        }

        localStorage.setItem('nanaAllProducts', JSON.stringify(products));
        return products;
    }

    // Load products (seed if needed)
    let products = seedProductsIfEmpty();
    let cart = JSON.parse(localStorage.getItem('nanaSelected')) || [];

    function saveCart(c) { localStorage.setItem('nanaSelected', JSON.stringify(c)); }

    function render(category = 'all') {
        const filtered = category === 'all' ? products : products.filter(p => p.category === category);
        const grid = document.getElementById('productGrid');
        grid.innerHTML = filtered.map(p => {
            const selected = cart.some(item => item.id === p.id) ? 'selected' : '';
            return `<div class="product-card ${selected}" data-id="${p.id}">
                <img src="${p.imageUrl}" alt="${p.name}">
                <div class="product-name">${p.name}</div>
                <div class="product-price">${p.price.toLocaleString()} RWF</div>
                <div class="product-shop">${p.shopName}</div>
            </div>`;
        }).join('');

        document.querySelectorAll('.product-card').forEach(card => {
            card.addEventListener('click', () => {
                const id = card.dataset.id;
                const prod = products.find(p => p.id == id);
                const index = cart.findIndex(i => i.id == id);
                if (index === -1) {
                    cart.push({ id: prod.id, name: prod.name, price: prod.price, shop: prod.shopName });
                } else {
                    cart.splice(index, 1);
                }
                saveCart(cart);
                render(category); // re-render to update selected class
            });
        });
    }

    // Build category filter (unique categories from products)
    const cats = [...new Set(products.map(p => p.category))].sort();
    const filterDiv = document.getElementById('categoryFilter');
    filterDiv.innerHTML = '<span class="cat-pill active-cat" data-cat="all">All</span>' +
        cats.map(c => `<span class="cat-pill" data-cat="${c}">${c}</span>`).join('');

    document.querySelectorAll('.cat-pill').forEach(pill => {
        pill.addEventListener('click', () => {
            document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active-cat'));
            pill.classList.add('active-cat');
            render(pill.dataset.cat);
        });
    });

    // Initial render
    render('all');
})();
</script>
</body>
</html>
