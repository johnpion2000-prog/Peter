<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nana Market · Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', sans-serif; }
        body { background:#f5f9fe; color:#1e2e3f; line-height:1.5; padding:2rem; }
        .container { max-width:1200px; margin:0 auto; }
        .navbar { display:flex; flex-wrap:wrap; justify-content:space-between; background:white; padding:1rem 2rem; border-radius:60px; margin-bottom:2rem; }
        .logo { font-size:2rem; font-weight:800; background:linear-gradient(145deg,#1d4e6b,#c05e1a); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .nav-links a { text-decoration:none; background:#eef3f9; color:#1d4059; padding:0.5rem 1rem; border-radius:40px; margin:0 0.2rem; }
        .page-title { font-size:2rem; color:#1d4e6b; border-left:7px solid #e67e2a; padding-left:1rem; margin:1.5rem 0; }
        .vendor-header { background:white; border-radius:2rem; padding:1.5rem; margin-bottom:2rem; display:flex; gap:2rem; }
        .product-upload-card { background:#e5f0f9; border-radius:2rem; padding:1.5rem; margin-bottom:2rem; }
        .form-group { margin-bottom:1rem; }
        .form-group input, .form-group textarea { width:100%; padding:0.8rem; border-radius:50px; border:2px solid #c7ddec; }
        .btn { background:#1d4e6b; color:white; border:none; padding:0.8rem 1.5rem; border-radius:50px; cursor:pointer; }
        .product-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:1rem; }
        .product-card { background:white; border-radius:1.5rem; padding:1rem; text-align:center; }
        .product-card img { width:100px; height:100px; object-fit:cover; border-radius:1rem; }
    </style>
</head>
<body>
<div class="container">
    <div class="navbar">
        <div class="logo"><i class="fas fa-store"></i> Nana</div>
        <div class="nav-links">
            <a href="index.html">Home</a><a href="products.html">Products</a><a href="cart.html">Cart</a><a href="payment.html">Payment</a>
        </div>
    </div>
    <h1 class="page-title">Dashboard</h1>
    <div id="dashboardContent">Loading...</div>
</div>
<script>
    (function() {
        const user = JSON.parse(localStorage.getItem('nanaCurrentUser'));
        const dash = document.getElementById('dashboardContent');
        if (!user) { dash.innerHTML = '<p>Please <a href="signin.html">sign in</a>.</p>'; return; }

        function getAllProducts() { return JSON.parse(localStorage.getItem('nanaAllProducts')) || []; }
        function saveProducts(prods) { localStorage.setItem('nanaAllProducts', JSON.stringify(prods)); }

        if (user.type === 'vendor') {
            let myProducts = getAllProducts().filter(p => p.vendorEmail === user.email);
            let html = `
                <div class="vendor-header"><h3>${user.name} (vendor)</h3><span>${myProducts.length} products</span></div>
                <div class="product-upload-card">
                    <h3>➕ Add new product</h3>
                    <div class="form-group"><input id="prodName" placeholder="Product name"></div>
                    <div class="form-group"><input type="number" id="prodPrice" placeholder="Price RWF"></div>
                    <div class="form-group"><input id="prodCategory" placeholder="Category (e.g., Electronics)"></div>
                    <div class="form-group"><textarea id="prodDesc" placeholder="Description"></textarea></div>
                    <button class="btn" id="uploadBtn">Publish</button>
                </div>
                <h3>Your products</h3>
                <div class="product-grid" id="vendorProducts"></div>
            `;
            dash.innerHTML = html;

            document.getElementById('uploadBtn').addEventListener('click', () => {
                const name = document.getElementById('prodName').value.trim();
                const price = parseFloat(document.getElementById('prodPrice').value);
                const cat = document.getElementById('prodCategory').value.trim();
                const desc = document.getElementById('prodDesc').value.trim();
                if (!name || !price) return alert('Fill name and price');
                const prods = getAllProducts();
                prods.push({
                    id: Date.now() + Math.random(),
                    vendorEmail: user.email,
                    shopName: user.name,
                    name, price, category: cat, desc,
                    imageUrl: 'https://via.placeholder.com/150?text='+name
                });
                saveProducts(prods);
                location.reload();
            });

            // render vendor products
            const container = document.getElementById('vendorProducts');
            container.innerHTML = myProducts.map(p => `
                <div class="product-card">
                    <img src="${p.imageUrl}"><div>${p.name}</div><div>${p.price} RWF</div>
                </div>`).join('');
        } else {
            // buyer dashboard
            const cart = JSON.parse(localStorage.getItem('nanaSelected')) || [];
            dash.innerHTML = `
                <div style="background:white; border-radius:2rem; padding:2rem;">
                    <h3>👤 Buyer: ${user.name}</h3>
                    <p>Items in cart: ${cart.length}</p>
                    <a href="products.html" class="btn">Browse products</a>
                </div>`;
        }
    })();
</script>
</body>
</html>
