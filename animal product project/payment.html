<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nana Market · Payment</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', sans-serif; }
        body { background:#f5f9fe; padding:2rem; }
        .container { max-width:900px; margin:0 auto; }
        .navbar { display:flex; flex-wrap:wrap; justify-content:space-between; background:white; padding:1rem 2rem; border-radius:60px; margin-bottom:2rem; }
        .logo { font-size:2rem; font-weight:800; background:linear-gradient(145deg,#1d4e6b,#c05e1a); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .nav-links a { text-decoration:none; background:#eef3f9; color:#1d4059; padding:0.5rem 1rem; border-radius:40px; }
        .payment-area { background:white; border-radius:2.5rem; padding:2rem; }
        .cart-summary { background:#f0f7fe; border-radius:1.5rem; padding:1.5rem; margin:1.5rem 0; }
        .pay-methods { display:flex; gap:1.5rem; flex-wrap:wrap; margin:2rem 0; }
        .pay-btn { background:#eef3f9; border:2px solid #a2c0d8; padding:1rem 2rem; border-radius:60px; font-weight:700; font-size:1.2rem; display:flex; align-items:center; gap:10px; cursor:pointer; }
        .pay-btn i { color:#c05e1a; }
        .total-price { font-size:2rem; font-weight:800; color:#1d4e6b; }
        .btn { background:#1d4e6b; color:white; border:none; padding:0.8rem 1.5rem; border-radius:50px; cursor:pointer; }
    </style>
</head>
<body>
<div class="container">
    <div class="navbar">
        <div class="logo"><i class="fas fa-store"></i> Nana</div>
        <div class="nav-links"><a href="index.html">Home</a><a href="cart.html">Cart</a><a href="delivery.html">Delivery</a></div>
    </div>
    <div class="payment-area">
        <h2>Checkout</h2>
        <div class="cart-summary" id="cartSummary"></div>
        <div id="deliveryInfo" style="margin:1rem 0; font-weight:600;"></div>
        <div class="pay-methods">
            <div class="pay-btn" id="payCash"><i class="fas fa-money-bill-wave"></i> Cash</div>
            <div class="pay-btn" id="payMomo"><i class="fas fa-mobile-alt"></i> Mobile Money</div>
            <div class="pay-btn" id="payCard"><i class="fas fa-credit-card"></i> Card</div>
            <span class="total-price" id="totalDisplay">0 RWF</span>
        </div>
        <div id="paymentMessage" style="font-weight:600;"></div>
        <p style="margin-top:1.5rem;"><a href="delivery.html" class="btn">Choose delivery zone</a></p>
    </div>
</div>
<script>
    (function() {
        const cart = JSON.parse(localStorage.getItem('nanaSelected')) || [];
        const delivery = localStorage.getItem('nanaDeliveryLocation') || '';
        const summary = document.getElementById('cartSummary');
        const totalSpan = document.getElementById('totalDisplay');
        const deliveryInfo = document.getElementById('deliveryInfo');

        if (cart.length === 0) {
            summary.innerHTML = '<p>Cart empty. <a href="products.html">Shop now</a></p>';
            totalSpan.innerText = '0 RWF';
        } else {
            let html = '<ul>';
            let total = 0;
            cart.forEach(i => { html += `<li>${i.name} – ${i.price.toLocaleString()} RWF</li>`; total += i.price; });
            html += '</ul>';
            summary.innerHTML = html;
            totalSpan.innerText = total.toLocaleString() + ' RWF';
        }

        deliveryInfo.innerText = delivery ? `🚚 Delivery to: ${delivery}` : '⚠️ No delivery zone selected. Go to Delivery page.';

        function processPayment(method) {
            if (!cart.length) { document.getElementById('paymentMessage').innerText = 'Cart empty.'; return; }
            if (!delivery) { document.getElementById('paymentMessage').innerText = 'Please select a delivery zone first.'; return; }
            localStorage.removeItem('nanaSelected'); // clear cart after payment
            document.getElementById('paymentMessage').innerHTML = `✅ Order placed with ${method}. Will be delivered to ${delivery}. Thank you!`;
            // optionally redirect after a delay
        }

        document.getElementById('payCash').addEventListener('click', () => processPayment('Cash'));
        document.getElementById('payMomo').addEventListener('click', () => processPayment('Mobile Money'));
        document.getElementById('payCard').addEventListener('click', () => processPayment('Card'));
    })();
</script>
</body>
</html>
