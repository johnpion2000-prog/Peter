<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Aura payment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #f7fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 2rem;
        }

        .logo {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #0b1b3a;
            margin-bottom: 2rem;
        }

        .signup-card {
            background: white;
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }

        h2 {
            color: #0b1b3a;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #718096;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            color: #4a5568;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .optional {
            color: #a0aec0;
            font-size: 0.85rem;
            font-weight: normal;
            margin-left: 0.5rem;
        }

        input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #0b1b3a;
        }

        input::placeholder {
            color: #a0aec0;
        }

        .password-requirements {
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: #718096;
        }

        .create-account-btn {
            width: 100%;
            padding: 1rem;
            background: #0b1b3a;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin: 1.5rem 0 1rem;
            transition: background 0.3s;
        }

        .create-account-btn:hover {
            background: #1a2b4a;
        }

        .signin-link {
            text-align: center;
            color: #718096;
        }

        .signin-link a {
            color: #0b1b3a;
            text-decoration: none;
            font-weight: 600;
        }

        .error-message {
            color: #e53e3e;
            font-size: 0.85rem;
            margin-top: 0.25rem;
            display: none;
        }

        .success-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .success-modal.show {
            display: flex;
        }

        .success-box {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            text-align: center;
            max-width: 500px;
            animation: scaleIn 0.3s ease-out;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .success-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: bounce 0.6s ease-out;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .success-box h3 {
            color: #22863a;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .success-box p {
            color: #666;
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }

        .countdown {
            color: #0b1b3a;
            font-weight: bold;
            font-size: 1.2rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Aura payment</div>
        
        <div class="signup-card">
            <h2>Create Account</h2>
            <div class="subtitle">Get started with your account</div>

            <form id="signupForm" onsubmit="return handleSignup(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" placeholder="alex walter" required>
                    <div class="error-message" id="nameError"></div>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="example@gmail.com" required>
                    <div class="error-message" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label>Display Name <span class="optional">(Optional)</span></label>
                    <input type="text" id="displayName" placeholder="Kone">
                </div>

                <div class="form-group">
                    <label>Phone Number <span class="optional">(Optional)</span></label>
                    <input type="tel" id="phone" placeholder="+7 000 000 00 00 ">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                    <div class="password-requirements">
                        Minimum 8 characters with at least one number
                    </div>
                    <div class="error-message" id="passwordError"></div>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" required>
                    <div class="error-message" id="confirmError"></div>
                </div>

                <div id="feedbackMessage" style="display: none; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; text-align: center;"></div>

                <button type="submit" class="create-account-btn" id="submitBtn">
                    Create Account
                </button>

                <div class="signin-link">
                    Already have an account? <a href="signin.html">Sign in</a>
                </div>
            </form>
        </div>
    </div>

    <div id="successModal" class="success-modal">
        <div class="success-box">
            <div class="success-icon">✅</div>
            <h3>Account Created Successfully!</h3>
            <p>Your account has been created and is ready to use.</p>
            <p>You will be redirected to sign in in <span class="countdown"><span id="countdown">3</span> seconds</span></p>
        </div>
    </div>

    <script>
        async function handleSignup(event) {
            event.preventDefault();
            
            // Reset error messages
            document.querySelectorAll('.error-message').forEach(el => {
                el.style.display = 'none';
            });

            const feedbackDiv = document.getElementById('feedbackMessage');
            feedbackDiv.style.display = 'none';

            // Get values
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const displayName = document.getElementById('displayName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('submitBtn');

            let isValid = true;

            // Validation
            if (fullName.length < 3) {
                showError('nameError', 'Please enter your full name');
                isValid = false;
            }

            if (!isValidEmail(email)) {
                showError('emailError', 'Please enter a valid email address');
                isValid = false;
            }

            if (password.length < 8) {
                showError('passwordError', 'Password must be at least 8 characters');
                isValid = false;
            }

            if (password !== confirmPassword) {
                showError('confirmError', 'Passwords do not match');
                isValid = false;
            }

            if (!isValid) {
                return false;
            }

            // Disable button and show loading state
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Creating account...';

            try {
                console.log('📝 Sending signup request for:', email);
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        fullName,
                        email,
                        displayName,
                        phone,
                        password
                    })
                });
                
                const data = await response.json();
                console.log('📨 Response status:', response.status);
                console.log('📨 Response data:', data);
                
                if (response.ok) {
                    // Show success modal
                    const successModal = document.getElementById('successModal');
                    successModal.classList.add('show');
                    
                    console.log('✓ Account created! Redirecting...');
                    
                    // Countdown timer
                    let count = 3;
                    const countdownEl = document.getElementById('countdown');
                    const interval = setInterval(() => {
                        count--;
                        countdownEl.textContent = count;
                        if (count <= 0) {
                            clearInterval(interval);
                            window.location.href = 'signin.html';
                        }
                    }, 1000);
                } else {
                    // Show error message
                    feedbackDiv.style.display = 'block';
                    feedbackDiv.style.background = '#fed7d7';
                    feedbackDiv.style.color = '#742a2a';
                    feedbackDiv.style.border = '2px solid #fc8181';
                    feedbackDiv.innerHTML = '❌ <strong>Signup failed</strong><br>' + (data.message || 'Please try again.');
                    
                    console.log('❌ Signup failed:', data.message);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Create Account';
                }
            } catch (error) {
                console.error('❌ Network error:', error);
                feedbackDiv.style.display = 'block';
                feedbackDiv.style.background = '#fed7d7';
                feedbackDiv.style.color = '#742a2a';
                feedbackDiv.style.border = '2px solid #fc8181';
                feedbackDiv.innerHTML = '❌ <strong>Connection Error</strong><br>Make sure the server is running at http://localhost:3000<br><small>' + error.message + '</small>';
                
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
            }
            return false;
        }

        function showError(elementId, message) {
            const errorEl = document.getElementById(elementId);
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }

        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }
    </script>
</body>
</html>
