<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Aura payment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #f7fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 2rem;
        }

        .logo {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #0b1b3a;
            margin-bottom: 2rem;
        }

        .signup-card {
            background: white;
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }

        h2 {
            color: #0b1b3a;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #718096;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            color: #4a5568;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .optional {
            color: #a0aec0;
            font-size: 0.85rem;
            font-weight: normal;
            margin-left: 0.5rem;
        }

        input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #0b1b3a;
        }

        input::placeholder {
            color: #a0aec0;
        }

        .password-requirements {
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: #718096;
        }

        .create-account-btn {
            width: 100%;
            padding: 1rem;
            background: #0b1b3a;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin: 1.5rem 0 1rem;
            transition: background 0.3s;
        }

        .create-account-btn:hover {
            background: #1a2b4a;
        }

        .signin-link {
            text-align: center;
            color: #718096;
        }

        .signin-link a {
            color: #0b1b3a;
            text-decoration: none;
            font-weight: 600;
        }

        .error-message {
            color: #e53e3e;
            font-size: 0.85rem;
            margin-top: 0.25rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Aura payment</div>
        
        <div class="signup-card">
            <h2>Create Account</h2>
            <div class="subtitle">Get started with your account</div>

            <form id="signupForm" onsubmit="return handleSignup(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" placeholder="alex walter" required>
                    <div class="error-message" id="nameError"></div>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="example@gmail.com" required>
                    <div class="error-message" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label>Display Name <span class="optional">(Optional)</span></label>
                    <input type="text" id="displayName" placeholder="Kone">
                </div>

                <div class="form-group">
                    <label>Phone Number <span class="optional">(Optional)</span></label>
                    <input type="tel" id="phone" placeholder="+7 000 000 00 00 ">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                    <div class="password-requirements">
                        Minimum 8 characters with at least one number
                    </div>
                    <div class="error-message" id="passwordError"></div>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" required>
                    <div class="error-message" id="confirmError"></div>
                </div>

                <button type="submit" class="create-account-btn">
                    Create Account
                </button>

                <div class="signin-link">
                    Already have an account? <a href="signin.html">Sign in</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        async function handleSignup(event) {
            event.preventDefault();
            // Reset error messages
            document.querySelectorAll('.error-message').forEach(el => {
                el.style.display = 'none';
            });

            // Get values
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const displayName = document.getElementById('displayName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            let isValid = true;

            // Validation
            if (fullName.length < 3) {
                showError('nameError', 'Please enter your full name');
                isValid = false;
            }

            if (!isValidEmail(email)) {
                showError('emailError', 'Please enter a valid email address');
                isValid = false;
            }

            if (password.length < 8) {
                showError('passwordError', 'Password must be at least 8 characters');
                isValid = false;
            }

            if (password !== confirmPassword) {
                showError('confirmError', 'Passwords do not match');
                isValid = false;
            }

            if (!isValid) {
                return false;
            }

            // Send signup data to backend
            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        fullName,
                        email,
                        displayName,
                        phone,
                        password
                    })
                });
                const data = await response.json();
                if (response.ok) {
                    alert('Account created successfully! Please sign in.');
                    window.location.href = 'signin.html';
                } else {
                    alert(data.message || 'Signup failed.');
                }
            } catch (error) {
                alert('An error occurred. Please try again.');
            }
            return false;
        }

        function showError(elementId, message) {
            const errorEl = document.getElementById(elementId);
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }

        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }
    </script>
</body>
</html>
