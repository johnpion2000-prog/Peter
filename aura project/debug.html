<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Project Debug Console</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Monaco', 'Courier New', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #4fc3f7;
            margin-bottom: 1rem;
        }

        .debug-section {
            background: #252526;
            border: 1px solid #464647;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .debug-section h2 {
            color: #7cb342;
            font-size: 1.1rem;
            margin-bottom: 0.8rem;
        }

        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
            font-family: inherit;
        }

        button:hover {
            background: #1177bb;
        }

        .output {
            background: #1e1e1e;
            border: 1px solid #464647;
            border-radius: 4px;
            padding: 1rem;
            margin-top: 0.8rem;
            max-height: 300px;
            overflow-y: auto;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .status-ok {
            color: #7cb342;
        }

        .status-error {
            color: #f48771;
        }

        .status-info {
            color: #7cb342;
        }

        .form-test {
            background: #2d2d30;
            padding: 1rem;
            border-radius: 4px;
            margin-top: 0.8rem;
        }

        .form-test input {
            display: block;
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 0.5rem;
            background: #3e3e42;
            color: #d4d4d4;
            border: 1px solid #464647;
            border-radius: 4px;
            font-family: inherit;
        }

        .form-test button {
            width: 100%;
            margin-right: 0;
        }

        input::placeholder {
            color: #858585;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #464647;
            border-top: 2px solid #7cb342;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <h1>🔧 Aura Project Debug Console</h1>

    <div class="debug-section">
        <h2>✅ 1. Server Status</h2>
        <button onclick="checkServer()">Check Server</button>
        <div id="serverOutput" class="output"></div>
    </div>

    <div class="debug-section">
        <h2>📊 2. Database Status</h2>
        <button onclick="checkDatabase()">Check Database</button>
        <div id="databaseOutput" class="output"></div>
    </div>

    <div class="debug-section">
        <h2>👤 3. API Testing</h2>
        <div class="form-test">
            <h3 style="color: #7cb342; margin-bottom: 0.8rem;">Test Signup</h3>
            <input type="text" id="testFullName" placeholder="Full Name (e.g., John Doe)" value="Test User">
            <input type="email" id="testEmail" placeholder="Email" value="">
            <input type="text" id="testDisplayName" placeholder="Display Name" value="testuser">
            <input type="password" id="testPassword" placeholder="Password" value="password123">
            <button onclick="testSignup()">Test Signup API</button>
            <div id="signupOutput" class="output"></div>
        </div>

        <div class="form-test" style="margin-top: 1rem;">
            <h3 style="color: #7cb342; margin-bottom: 0.8rem;">Test Login</h3>
            <input type="email" id="testLoginEmail" placeholder="Email" value="john@example.com">
            <input type="password" id="testLoginPassword" placeholder="Password" value="password123">
            <button onclick="testLogin()">Test Login API</button>
            <div id="loginOutput" class="output"></div>
        </div>
    </div>

    <div class="debug-section">
        <h2>💾 4. Local Storage</h2>
        <button onclick="checkLocalStorage()">Check LocalStorage</button>
        <button onclick="clearLocalStorage()">Clear All Data</button>
        <div id="storageOutput" class="output"></div>
    </div>

    <div class="debug-section">
        <h2>🌐 5. Browser Info</h2>
        <button onclick="checkBrowser()">Check Browser Info</button>
        <div id="browserOutput" class="output"></div>
    </div>

    <script>
        function log(output, message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'status-error' : type === 'ok' ? 'status-ok' : 'status-info';
            const icon = type === 'error' ? '❌' : type === 'ok' ? '✅' : 'ℹ️';
            output.innerHTML += `<div class="${className}">${icon} [${timestamp}] ${message}</div>`;
            output.scrollTop = output.scrollHeight;
        }

        async function checkServer() {
            const output = document.getElementById('serverOutput');
            output.innerHTML = '';
            log(output, 'Checking server connectivity...', 'info');

            try {
                const response = await fetch('http://localhost:3000/api/health', {
                    method: 'GET'
                });
                if (response.status === 200 || response.status === 404) {
                    log(output, 'Server is responding on port 3000!', 'ok');
                } else {
                    log(output, `Server responded with status ${response.status}`, 'info');
                }
            } catch (err) {
                log(output, `Server not responding: ${err.message}`, 'error');
            }
        }

        async function checkDatabase() {
            const output = document.getElementById('databaseOutput');
            output.innerHTML = '';
            log(output, 'Checking database status...', 'info');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: 'test@test.com', password: 'test' })
                });
                if (response.status === 401) {
                    log(output, 'Database is accessible! (API endpoint responded)', 'ok');
                } else if (response.status === 200) {
                    log(output, 'Database is working! (unexpected auth success)', 'ok');
                } else {
                    log(output, `API responded with status ${response.status}`, 'info');
                }
            } catch (err) {
                log(output, `Cannot reach database: ${err.message}`, 'error');
            }
        }

        async function testSignup() {
            const output = document.getElementById('signupOutput');
            output.innerHTML = '';

            const fullName = document.getElementById('testFullName').value;
            const email = document.getElementById('testEmail').value;
            const displayName = document.getElementById('testDisplayName').value;
            const password = document.getElementById('testPassword').value;

            if (!email) {
                log(output, 'Please enter an email', 'error');
                return;
            }

            log(output, `Signing up: ${email}...`, 'info');

            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, email, displayName, password })
                });

                const data = await response.json();

                if (response.ok) {
                    log(output, `✅ Account created! User ID: ${data.user.id}`, 'ok');
                    log(output, `Email: ${data.user.email}`, 'ok');
                } else {
                    log(output, `Error: ${data.message || 'Unknown error'}`, 'error');
                }
            } catch (err) {
                log(output, `Network error: ${err.message}`, 'error');
            }
        }

        async function testLogin() {
            const output = document.getElementById('loginOutput');
            output.innerHTML = '';

            const email = document.getElementById('testLoginEmail').value;
            const password = document.getElementById('testLoginPassword').value;

            log(output, `Logging in: ${email}...`, 'info');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    log(output, `✅ Login successful!`, 'ok');
                    log(output, `Token: ${data.token.substring(0, 20)}...`, 'ok');
                    log(output, `User: ${data.user.full_name} (${data.user.email})`, 'ok');
                } else {
                    log(output, `Login failed: ${data.message || 'Invalid credentials'}`, 'error');
                }
            } catch (err) {
                log(output, `Network error: ${err.message}`, 'error');
            }
        }

        function checkLocalStorage() {
            const output = document.getElementById('storageOutput');
            output.innerHTML = '';

            const keys = Object.keys(localStorage);
            if (keys.length === 0) {
                log(output, 'LocalStorage is empty', 'info');
                return;
            }

            log(output, `Found ${keys.length} items in LocalStorage:`, 'info');
            keys.forEach(key => {
                const value = localStorage.getItem(key);
                try {
                    const parsed = JSON.parse(value);
                    log(output, `${key}: ${JSON.stringify(parsed, null, 2)}`, 'ok');
                } catch {
                    log(output, `${key}: ${value}`, 'ok');
                }
            });
        }

        function clearLocalStorage() {
            localStorage.clear();
            document.getElementById('storageOutput').innerHTML = '<div class="status-ok">✅ LocalStorage cleared!</div>';
        }

        function checkBrowser() {
            const output = document.getElementById('browserOutput');
            output.innerHTML = '';
            log(output, `User Agent: ${navigator.userAgent}`, 'info');
            log(output, `Language: ${navigator.language}`, 'info');
            log(output, `Online: ${navigator.onLine ? 'Yes' : 'No'}`, 'ok');
            log(output, `LocalStorage Available: ${typeof(localStorage) !== 'undefined' ? 'Yes' : 'No'}`, 'ok');
            log(output, `Current URL: ${window.location.href}`, 'info');
        }

        // Auto-check server on page load
        window.addEventListener('load', () => {
            checkServer();
            checkBrowser();
        });
    </script>
</body>
</html>
