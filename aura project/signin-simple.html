<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Aura payment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .signin-card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: #0b1b3a;
            margin-bottom: 1.5rem;
        }

        h2 {
            color: #0b1b3a;
            margin-bottom: 0.3rem;
            text-align: center;
            font-size: 1.3rem;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            color: #2d3748;
            font-weight: 600;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
            background: #f7fafc;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .signup-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #718096;
            font-size: 0.9rem;
        }

        .signup-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .message {
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            display: none;
            text-align: center;
            font-weight: 500;
        }

        .message.error {
            display: block;
            background: #fed7d7;
            color: #742a2a;
            border: 1px solid #fc8181;
        }

        .message.success {
            display: block;
            background: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }

        /* Success Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 2.5rem;
            text-align: center;
            max-width: 400px;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .success-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            animation: bounce 0.6s ease-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .modal h3 {
            color: #22863a;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .modal p {
            color: #4a5568;
            margin-bottom: 0.3rem;
        }

        .countdown {
            color: #667eea;
            font-weight: bold;
            font-size: 1.2rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="signin-card">
            <div class="logo">💳 Aura</div>
            <h2>Welcome Back</h2>
            <p class="subtitle">Sign in to your account</p>

            <div id="statusMessage" class="message"></div>

            <form id="signinForm" onsubmit="handleSignIn(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="john@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Your password" required>
                </div>

                <button type="submit" class="btn" id="submitBtn">Sign In</button>
            </form>

            <div class="signup-link">
                Don't have an account? <a href="signup-simple.html">Create one here</a>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <div class="success-icon">✅</div>
            <h3>Sign In Successful!</h3>
            <p>Welcome! You're being redirected to your dashboard...</p>
            <div class="countdown">Redirecting in <span id="countdown">2</span> seconds</div>
        </div>
    </div>

    <script>
        const form = document.getElementById('signinForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');

        function showStatus(message, type = 'success') {
            statusMessage.className = `message ${type}`;
            statusMessage.innerHTML = message;
        }

        async function handleSignIn(event) {
            event.preventDefault();
            statusMessage.style.display = 'none';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showStatus('❌ Please fill in all fields', 'error');
                return;
            }

            // Disable button and show loading state
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Signing in...';

            try {
                console.log('📝 Signing in:', email);

                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                console.log('📨 Response status:', response.status);

                const data = await response.json();
                console.log('📨 Response data:', data);

                if (response.ok && data.token) {
                    console.log('✅ Login successful!');

                    // Store token and user data
                    localStorage.setItem('authToken', data.token);

                    // Normalize user data (handle both snake_case and camelCase)
                    const user = data.user || {};
                    const userData = {
                        id: user.id,
                        fullName: user.fullName || user.full_name || 'User',
                        displayName: user.displayName || user.display_name,
                        email: user.email,
                        role: user.role || 'user'
                    };

                    console.log('💾 Saving user data:', userData);
                    localStorage.setItem('currentUser', JSON.stringify(userData));

                    // Show success modal
                    const successModal = document.getElementById('successModal');
                    successModal.classList.add('show');

                    // Countdown timer
                    let count = 2;
                    const countdownEl = document.getElementById('countdown');
                    const interval = setInterval(() => {
                        count--;
                        countdownEl.textContent = count;
                        if (count <= 0) {
                            clearInterval(interval);
                            window.location.href = 'dashboard.html';
                        }
                    }, 1000);
                } else {
                    const errorMsg = data.message || 'Invalid email or password';
                    console.log('❌ Error:', errorMsg);
                    showStatus(`❌ ${errorMsg}`, 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In';
                }
            } catch (error) {
                console.log('❌ Network error:', error.message);
                showStatus(`❌ Connection error: ${error.message}`, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        }

        // Log page load
        console.log('✨ Sign in page loaded');
    </script>
</body>
</html>
