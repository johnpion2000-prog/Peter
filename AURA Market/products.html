      <input type="range" id="price-range" min="0" max="500000" value="500000" step="5000">
      <div class="price-range-labels"><span>RWF 0</span><span id="price-label">RWF 500,000</span></div>

  <!-- Products -->
  <div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px">
      <p id="results-count" style="font-size:14px;color:var(--text-muted)">Loading…</p>
    </div>
    <div class="products-grid" id="products-grid">

    </div>
  </div>
</div>

<footer class="footer" style="margin-top:60px">
  <div class="footer-bottom">&copy; 2026 AURA Market. All rights reserved.</div>
</footer>

<script type="module">
  import { fetchProducts, searchProducts, renderProducts } from './js/products.js';
  import { initNavAuth } from './js/auth.js';

  initNavAuth();

  const params = new URLSearchParams(location.search);
  const initCat = params.get('cat') || '';
  const initSearch = params.get('search') || '';
  const initDiscount = params.get('discount') === '1';

  // Set active nav category
  if (initCat) {
    const el = document.getElementById('cat-' + initCat);
    if (el) el.classList.add('active');
  } else {
    document.getElementById('cat-all').classList.add('active');
  }

  // Pre-fill filters
  if (initCat) {
    const radio = document.querySelector(`input[name="cat"][value="${initCat}"]`);
    if (radio) radio.checked = true;
  } else {
    document.querySelector(`input[name="cat"][value=""]`).checked = true;
  }
  if (initDiscount) document.getElementById('only-discount').checked = true;

  const pageTitle = document.getElementById('page-title');
  if (initSearch) pageTitle.textContent = `Search: "${initSearch}"`;
  else if (initCat) pageTitle.textContent = initCat.charAt(0).toUpperCase() + initCat.slice(1) + ' Food';

  // Price label
  const priceRange = document.getElementById('price-range');
  const priceLabel = document.getElementById('price-label');
  priceRange.addEventListener('input', () => { priceLabel.textContent = 'RWF\u00a0' + parseInt(priceRange.value).toLocaleString('en-US'); });

  async function loadProducts() {
    const grid = document.getElementById('products-grid');
    const count = document.getElementById('results-count');
    grid.innerHTML = '<div class="spinner"></div>';

    let products;
    if (initSearch) {
      products = await searchProducts(initSearch);
    } else {
      const cat = document.querySelector('input[name="cat"]:checked')?.value || '';
      const max = parseInt(priceRange.value);
      const onlyDiscount = document.getElementById('only-discount').checked;
      products = await fetchProducts({ category: cat, maxPrice: max, onlyDiscount });
    }

    count.textContent = `${products.length} product${products.length !== 1 ? 's' : ''} found`;
    renderProducts(products, grid);
  }

  loadProducts();

  document.getElementById('apply-filters').addEventListener('click', loadProducts);

  document.getElementById('reset-filters').addEventListener('click', () => {
    document.querySelector('input[name="cat"][value=""]').checked = true;
    priceRange.value = 500000; priceLabel.textContent = 'RWF\u00a0500,000';
    document.getElementById('only-discount').checked = false;
    loadProducts();
  });

  document.getElementById('search-btn').addEventListener('click', () => {
    const q = document.getElementById('search-input').value.trim();
    if (q) window.location.href = `products.html?search=${encodeURIComponent(q)}`;
  });

  document.getElementById('search-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('search-btn').click();
  });
</script>
