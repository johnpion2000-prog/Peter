<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account – AURA Market</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='32' font-size='32'>✨</text></svg>">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="logo">✨ AURA Market</div>
    <h2>Create Account</h2>
    <p class="auth-subtitle">Join AURA Market today</p>
    <div id="alert-box"></div>
    <button class="google-btn" id="google-signup-btn">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Sign up with Google
    </button>
    <div class="auth-divider">or</div>
    <form id="signup-form">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Your name" required autocomplete="name">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Min. 6 characters" required minlength="6" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirm-password" placeholder="Repeat password" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="submit-btn">Create Account</button>
    </form>
    <p class="auth-footer">Already have an account? <a href="signin.html">Sign In</a></p>
  </div>
</div>
<script type="module">
  import { signUp, signInWithGoogle, onAuth } from './js/auth.js';
  onAuth((user) => { if (user) window.location.href = 'index.html'; });
  function showAlert(msg, type='error') {
    document.getElementById('alert-box').innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  }
  document.getElementById('signup-form').addEventListener('submit', async e => {
    e.preventDefault();
    const pw = document.getElementById('password').value;
    const cpw = document.getElementById('confirm-password').value;
    if (pw !== cpw) { showAlert('Passwords do not match.'); return; }
    const btn = document.getElementById('submit-btn');
    btn.textContent = 'Creating account…'; btn.disabled = true;
    try {
      await signUp(
        document.getElementById('name').value.trim(),
        document.getElementById('email').value.trim(),
        pw
      );
      window.location.href = 'index.html';
    } catch(err) {
      const map = {
        'auth/email-already-in-use': 'An account with this email already exists.',
        'auth/invalid-email': 'Please enter a valid email address.',
        'auth/weak-password': 'Password must be at least 6 characters.'
      };
      showAlert(map[err.code] || 'Sign up failed. Please try again.');
      btn.textContent = 'Create Account'; btn.disabled = false;
    }
  });
  document.getElementById('google-signup-btn').addEventListener('click', async () => {
    try { await signInWithGoogle(); window.location.href = 'index.html'; }
    catch(err) { showAlert('Google sign-up failed. Please try again.'); }
  });
</script>
</body>
</html>
