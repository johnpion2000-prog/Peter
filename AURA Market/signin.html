<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – AURA Market</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='32' font-size='32'>✨</text></svg>">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="logo">✨ AURA Market</div>
    <h2>Welcome back!</h2>
    <p class="auth-subtitle">Sign in to continue shopping</p>
    <div id="alert-box"></div>
    <button class="google-btn" id="google-signin-btn">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Continue with Google
    </button>
    <div class="auth-divider">or</div>
    <form id="signin-form">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <div style="text-align:right;margin-bottom:16px;">
        <a href="reset-password.html" style="font-size:13px;color:var(--primary);font-weight:600">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="submit-btn">Sign In</button>
    </form>
    <p class="auth-footer">Don't have an account? <a href="signup.html">Sign Up</a></p>
  </div>
</div>
<script type="module">
  import { signIn, signInWithGoogle, onAuth } from './js/auth.js';
  onAuth((user) => { if (user) window.location.href = 'index.html'; });
  function showAlert(msg, type='error') {
    document.getElementById('alert-box').innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  }
  const errMap = {
    'auth/wrong-password':'Incorrect password.',
    'auth/user-not-found':'No account found with that email.',
    'auth/invalid-email':'Please enter a valid email address.',
    'auth/too-many-requests':'Too many attempts. Please try again later.',
    'auth/invalid-credential':'Invalid email or password.'
  };
  document.getElementById('signin-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    btn.textContent = 'Signing in…'; btn.disabled = true;
    try {
      await signIn(document.getElementById('email').value.trim(), document.getElementById('password').value);
      window.location.href = 'index.html';
    } catch(err) {
      showAlert(errMap[err.code] || 'Sign in failed. Please try again.');
      btn.textContent = 'Sign In'; btn.disabled = false;
    }
  });
  document.getElementById('google-signin-btn').addEventListener('click', async () => {
    try { await signInWithGoogle(); window.location.href = 'index.html'; }
    catch(err) { showAlert(errMap[err.code] || 'Google sign-in failed.'); }
  });
</script>
</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nana Market · Sign In</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', sans-serif; }
        body { background:#f5f9fe; color:#1e2e3f; line-height:1.5; padding:2rem; }
        .container { max-width:500px; margin:0 auto; }
        .navbar { display:flex; flex-wrap:wrap; justify-content:space-between; background:white; padding:1rem 2rem; border-radius:60px; margin-bottom:2rem; }
        .logo { font-size:2rem; font-weight:800; background:linear-gradient(145deg,#1d4e6b,#c05e1a); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .nav-links a { text-decoration:none; background:#eef3f9; color:#1d4059; padding:0.5rem 1rem; border-radius:40px; font-weight:600; margin:0 0.2rem; }
        .form-card { background:white; border-radius:3rem; padding:2.5rem 2rem; box-shadow:0 20px 35px -10px #1d4e6b55; }
        .form-group { margin-bottom:1.5rem; }
        .form-group label { font-weight:600; color:#1d4e6b; display:block; margin-bottom:0.4rem; }
        .form-group input { width:100%; padding:1rem 1.2rem; border:2px solid #c7ddec; border-radius:50px; }
        .btn { background:#1d4e6b; color:white; border:none; padding:1rem; border-radius:50px; font-weight:700; width:100%; cursor:pointer; }
    </style>
</head>
<body>
<div class="container">
    <div class="navbar">
        <div class="logo"><i class="fas fa-store"></i> Nana</div>
        <div class="nav-links"><a href="index.html">Home</a><a href="signup.html">Sign Up</a></div>
    </div>
    <div class="form-card">
        <h2 style="margin-bottom:1.5rem;">Sign in</h2>
        <div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="you@example.com"></div>
        <div class="form-group"><label>Password</label><input type="password" id="loginPass" placeholder="******"></div>
        <button class="btn" id="loginBtn">Sign in</button>
        <p class="small-note" style="margin-top:1rem;" id="loginMessage"></p>
    </div>
</div>
<script>
    document.getElementById('loginBtn').addEventListener('click', () => {
        const email = document.getElementById('loginEmail').value.trim();
        const pass = document.getElementById('loginPass').value;
        // Simple demo: accept any non-empty email, create a user based on email
        if (!email || !pass) { document.getElementById('loginMessage').innerText = 'Enter credentials'; return; }
        const type = email.includes('vendor') ? 'vendor' : 'buyer';
        const name = email.split('@')[0];
        const user = { name, email, password: pass, type };
        localStorage.setItem('nanaCurrentUser', JSON.stringify(user));
        window.location.href = 'dashboard.html';
    });
</script>
</body>
</html>
