<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – AURA Market</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='32' font-size='32'>✨</text></svg>">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="logo">✨ AURA Market</div>
    <h2>Reset Password</h2>
    <p class="auth-subtitle">Enter your email and we'll send a reset link</p>
    <div id="alert-box"></div>
    <form id="reset-form">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="submit-btn">Send Reset Link</button>
    </form>
    <p class="auth-footer"><a href="signin.html">← Back to Sign In</a></p>
  </div>
</div>
<script type="module">
  import { resetPassword } from './js/auth.js';
  function showAlert(msg, type='error') {
    document.getElementById('alert-box').innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  }
  document.getElementById('reset-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    btn.textContent = 'Sending…'; btn.disabled = true;
    try {
      await resetPassword(document.getElementById('email').value.trim());
      showAlert('Reset link sent! Check your email.', 'success');
      document.getElementById('reset-form').style.display = 'none';
    } catch(err) {
      const map = {
        'auth/user-not-found': 'No account found with that email.',
        'auth/invalid-email': 'Please enter a valid email address.'
      };
      showAlert(map[err.code] || 'Failed to send reset email.');
      btn.textContent = 'Send Reset Link'; btn.disabled = false;
    }
  });
</script>
</body>
</html>
